<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Nazarener Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:linear-gradient(135deg,#1a1f2e 0%,#0d1117 100%); min-height:100vh;
           display:flex; align-items:center; justify-content:center; }
    .login-card { background:#fff; border-radius:16px; padding:40px; width:100%; max-width:400px;
                  box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .brand-icon { font-size:3rem; color:#89b4fa; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="brand-icon"><i class="bi bi-robot"></i></div>
    <h4 class="mt-2 fw-bold">Nazarener Bot</h4>
    <p class="text-muted small">Web-Interface Login</p>
  </div>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">Passwort</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control form-control-lg"
               placeholder="Passwort eingeben" autofocus required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
      <i class="bi bi-box-arrow-in-right me-2"></i>Anmelden
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
